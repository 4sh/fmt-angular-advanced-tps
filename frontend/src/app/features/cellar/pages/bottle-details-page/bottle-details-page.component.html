<div class="bottleDetails">
    <div class="bottleForm">
        <bottle-form [bottle]="bottle" (submitted)="saveBottle($event)"></bottle-form>
    </div>
    <div class="bottleScores">
        @if (bottle?.id) {
            <bottle-scores [scores]="scores" (submitted)="createScore($event)"></bottle-scores>
        }
    </div>
</div>
