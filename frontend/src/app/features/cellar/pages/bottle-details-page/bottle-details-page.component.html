<div class="bottleDetails">
    <div class="bottleForm">
        <bottle-form [bottle]="bottle()" (submitted)="saveBottle($event)"></bottle-form>
    </div>
    @if(bottle()?.id) {
        <div class="bottleScores">
            <tabs>
                <tab [title]="'scores' | translate" path="scores" [default]="true"></tab>
                <tab [title]="'bottle.related' | translate" path="related"></tab>
            </tabs>
        </div>
    }
</div>
