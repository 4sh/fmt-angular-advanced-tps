<ul class="tabsList">
    @for (tab of tabs; track tab) {
        <li class="tabsList-item">
            <a class="tabsList-item-link"
               [routerLink]="['.', {outlets: {tab: tab.path()}}]"
               [routerLinkActive]="'_isActive'">
                {{ tab.title() }}
            </a>
        </li>
    }
</ul>

<div class="tabsContainer">
    <router-outlet name="tab"></router-outlet>
</div>
